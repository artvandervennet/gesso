<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="920" height="230"><title>Gitflow parts: lanes 32px apart at desktop, 20px on mobile</title><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6f8e9" stop-opacity="0"/><stop offset="1" stop-color="#d6f8e9"/></linearGradient></defs><rect width="920" height="230" fill="#d6f8e9"/><g id="main-lane" transform="translate(30 40)"><path d="M10 0 V160" fill="none" stroke="#005c3f" stroke-width="7" stroke-linecap="round"/><text x="0" y="-14" font-family="Atkinson Hyperlegible Next" font-size="13" fill="#00170e">main-lane</text></g><g id="fork" transform="translate(150 40)"><path d="M10 0 C10 30 42 50 42 80 V160" fill="none" stroke="#9b2549" stroke-width="5.5" stroke-linecap="round"/><text x="0" y="-14" font-family="Atkinson Hyperlegible Next" font-size="13" fill="#00170e">fork</text></g><g id="merge" transform="translate(270 40)"><path d="M42 0 V80 C42 110 10 130 10 160" fill="none" stroke="#9b2549" stroke-width="5.5" stroke-linecap="round"/><text x="0" y="-14" font-family="Atkinson Hyperlegible Next" font-size="13" fill="#00170e">merge</text></g><g id="open-branch" transform="translate(390 40)"><path d="M42 0 V160" fill="none" stroke="#f1bf5b" stroke-width="5.5" stroke-linecap="round"/><rect x="30" y="120" width="24" height="40" fill="url(#fade)"/><text x="0" y="-14" font-family="Atkinson Hyperlegible Next" font-size="13" fill="#00170e">open-branch</text></g><g id="commit-main" transform="translate(520 40)"><path d="M10 20 C10 9.5 29.5 10 30 20 C30.5 29.5 11 30.5 10 20Z" fill="#005c3f" stroke="#d6f8e9" stroke-width="2.5" paint-order="stroke"/><text x="0" y="-14" font-family="Atkinson Hyperlegible Next" font-size="13" fill="#00170e">commit-main</text></g><g id="commit-branch" transform="translate(650 40)"><path d="M11.5 20 C11.5 11.075 28.075 11.5 28.5 20 C28.925 28.075 12.35 28.925 11.5 20Z" fill="#9b2549" stroke="#d6f8e9" stroke-width="2.5" paint-order="stroke"/><text x="0" y="-14" font-family="Atkinson Hyperlegible Next" font-size="13" fill="#00170e">commit-branch</text></g><g id="commit-current" transform="translate(790 40)"><circle cx="20" cy="20" r="14.5" fill="none" stroke="#f1bf5b" stroke-width="2" opacity=".7"/><path d="M11.5 20 C11.5 11.075 28.075 11.5 28.5 20 C28.925 28.075 12.35 28.925 11.5 20Z" fill="#f1bf5b" stroke="#d6f8e9" stroke-width="2.5" paint-order="stroke"/><text x="0" y="-14" font-family="Atkinson Hyperlegible Next" font-size="13" fill="#00170e">commit-current</text></g></svg>
